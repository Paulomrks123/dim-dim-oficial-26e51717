<style>
.eagle-flight{transform-box:view-box;transform-origin:0 0;animation:eagle-cross 24s linear infinite}
.wing-left{transform-box:fill-box;transform-origin:100% 12%;animation:flap-left .9s ease-in-out infinite alternate}
.wing-right{transform-box:fill-box;transform-origin:0 12%;animation:flap-right .9s ease-in-out infinite alternate}
@keyframes eagle-cross{0%{transform:translate(1850px,205px) scale(.68) rotate(-4deg)}48%{transform:translate(790px,165px) scale(1) rotate(1deg)}100%{transform:translate(-520px,235px) scale(.72) rotate(5deg)}}
@keyframes flap-left{from{transform:rotate(-13deg) scaleY(.8)}to{transform:rotate(15deg) scaleY(1.13)}}
@keyframes flap-right{from{transform:rotate(13deg) scaleY(.8)}to{transform:rotate(-15deg) scaleY(1.13)}}
@media(prefers-reduced-motion:reduce){.eagle-flight,.wing-left,.wing-right{animation:none!important}}
</style></svg>