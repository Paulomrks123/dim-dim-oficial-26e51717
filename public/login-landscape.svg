 <path d="M18 4C95-5 190-65 300-105 270-65 252-28 214-5 270-18 324-37 390-70 350-25 300 8 242 26 300 28 350 22 420 2 358 58 276 78 202 54 130 36 78 24 30 25Z" class="wing wing-right"/>
